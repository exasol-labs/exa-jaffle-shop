name: CI – dbt-core & dbt-fusion vs Exasol

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  # Pull the Exasol Docker image once and cache it so the three Linux matrix
  # jobs load from cache instead of each downloading ~2 GB independently.
  pull-docker:
    name: Pull Exasol Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Cache Exasol Docker image
        id: cache-docker
        uses: actions/cache@v4
        with:
          path: /tmp/exasol-docker.tar.gz
          key: docker-exasol-2026.1.0

      - name: Pull and export Exasol Docker image
        if: steps.cache-docker.outputs.cache-hit != 'true'
        run: |
          docker pull exasol/docker-db:2026.1.0
          docker save exasol/docker-db:2026.1.0 | gzip > /tmp/exasol-docker.tar.gz

  dbt:
    name: dbt (${{ matrix.engine }}, ${{ matrix.os }})
    needs: pull-docker
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.continue-on-error }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (Exasol via Docker) ──────────────────────────
          - os: ubuntu-latest
            engine: dbt-core-python
            dbt-target: python
            use-docker: true
            needs-init-db: false   # dbt-exasol creates schemas automatically
            continue-on-error: false

          - os: ubuntu-latest
            engine: dbt-core-v2
            dbt-target: dev
            use-docker: true
            needs-init-db: true    # ADBC driver cannot create schemas
            continue-on-error: true   # alpha release

          - os: ubuntu-latest
            engine: dbt-fusion
            dbt-target: dev
            use-docker: true
            needs-init-db: true    # ADBC driver cannot create schemas
            continue-on-error: false


    env:
      EXASOL_HOST: localhost
      EXASOL_PORT: "8563"
      EXASOL_USER: sys
      EXASOL_PASSWORD: exasol
      DBT_PROFILES_DIR: ${{ github.workspace }}

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Load Exasol Docker image from cache ──────────────────────────────
      - name: Restore Exasol Docker image from cache
        if: matrix.use-docker
        uses: actions/cache@v4
        with:
          path: /tmp/exasol-docker.tar.gz
          key: docker-exasol-2026.1.0

      - name: Load Exasol Docker image
        if: matrix.use-docker
        run: docker load < /tmp/exasol-docker.tar.gz

      # ── Start Exasol (Docker) ─────────────────────────────────────────────
      # services: does not support --privileged; use docker run instead.
      - name: Start Exasol container (Linux)
        if: matrix.use-docker
        run: |
          docker run -d \
            --name exasol \
            --privileged \
            --shm-size=2g \
            -e COSLWD_ENABLED=1 \
            -p 8563:8563 \
            exasol/docker-db:2026.1.0

      # ── Install exapump ───────────────────────────────────────────────────
      - name: Install exapump
        run: |
          EXA_VER="0.9.2"
          curl -fsSL \
            "https://github.com/exasol-labs/exapump/releases/download/v${EXA_VER}/exapump-${EXA_VER}-linux-x86_64" \
            -o /usr/local/bin/exapump
          chmod +x /usr/local/bin/exapump

      # ── Wait for Exasol ───────────────────────────────────────────────────
      - name: Wait for Exasol to be ready
        run: bash scripts/wait_for_exasol.sh exasol 600

      # ── Initialize database (ADBC engines only) ──────────────────────────
      # dbt-exasol creates schemas automatically; the ADBC driver cannot.
      # init_db.sql creates JAFFLE_SHOP + JAFFLE_SHOP_RAW and pre-creates
      # seed tables with correct Exasol types (no TEXT, no unsupported DDL).
      - name: Initialize Exasol database
        if: matrix.needs-init-db
        run: exapump sql --profile ci < scripts/init_db.sql

      # ── dbt-core-python setup ─────────────────────────────────────────────
      - name: Set up Python
        if: matrix.engine == 'dbt-core-python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages (dbt-core-python)
        if: matrix.engine == 'dbt-core-python'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-dbt-core-python-${{ matrix.os }}

      - name: Install dbt-core + dbt-exasol
        if: matrix.engine == 'dbt-core-python'
        run: pip install "dbt-core==1.11.11" "dbt-exasol==1.10.6"

      # ── dbt-core-v2 setup ─────────────────────────────────────────────────
      - name: Set up Python (dbt-core-v2)
        if: matrix.engine == 'dbt-core-v2'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages (dbt-core-v2)
        if: matrix.engine == 'dbt-core-v2'
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-dbt-core-v2-${{ matrix.os }}

      - name: Install dbt-core v2
        if: matrix.engine == 'dbt-core-v2'
        run: pip install "dbt-core==2.0.0-alpha.1"

      - name: Install Exasol ADBC driver (dbt-core-v2)
        if: matrix.engine == 'dbt-core-v2'
        run: |
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dbc install exasol

      # ── dbt-fusion setup ──────────────────────────────────────────────────
      - name: Install dbt-fusion
        if: matrix.engine == 'dbt-fusion'
        run: |
          curl -fsSL https://public.cdn.getdbt.com/fs/install/install.sh \
            | sh -s -- --update
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Exasol ADBC driver (dbt-fusion)
        if: matrix.engine == 'dbt-fusion'
        run: |
          curl -LsSf https://dbc.columnar.tech/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          dbc install exasol

      # ── dbt_packages cache (all engines) ─────────────────────────────────
      - name: Cache dbt_packages
        uses: actions/cache@v4
        with:
          path: dbt_packages
          key: dbt-packages-${{ hashFiles('package-lock.yml') }}

      # ── dbt-core-python: deps + seed + run ───────────────────────────────
      - name: dbt deps + seed + run (dbt-core-python)
        if: matrix.engine == 'dbt-core-python'
        run: |
          dbt deps  --target ${{ matrix.dbt-target }}
          dbt seed  --target ${{ matrix.dbt-target }}
          dbt run   --target ${{ matrix.dbt-target }}

      # ── dbt-core-v2: deps + seed + run ───────────────────────────────────
      - name: dbt deps + seed + run (dbt-core-v2)
        if: matrix.engine == 'dbt-core-v2'
        run: |
          source scripts/setup_fusion_env.sh
          dbt deps --target ${{ matrix.dbt-target }}
          dbt seed --target ${{ matrix.dbt-target }}
          dbt run  --target ${{ matrix.dbt-target }}

      # ── dbt-fusion: deps + seed + run ─────────────────────────────────────
      - name: dbt deps + seed + run (dbt-fusion)
        if: matrix.engine == 'dbt-fusion'
        run: |
          source scripts/setup_fusion_env.sh
          dbt deps --target ${{ matrix.dbt-target }}
          dbt seed --target ${{ matrix.dbt-target }}
          dbt run  --target ${{ matrix.dbt-target }}

      # ── Diagnostics ───────────────────────────────────────────────────────
      - name: Dump Exasol container logs
        if: failure() && matrix.use-docker
        run: docker logs --tail 100 exasol 2>&1 || true

      - name: Stop Exasol container
        if: always() && matrix.use-docker
        run: docker rm -f exasol || true
